global:
   scrape_interval: 3s

scrape_configs:
   - job_name: 'coordinator'
     static_configs:
        - targets: ['coordinator:8080']

   - job_name: 'shard1'
     static_configs:
        - targets: ['shard1:8000']

   - job_name: 'shard2'
     static_configs:
        - targets: ['shard2:8001']

   - job_name: 'shard3'
     static_configs:
        - targets: ['shard3:8002']
